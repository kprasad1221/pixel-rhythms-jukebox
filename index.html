<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Music Playground — Scene & Party</title>
  <style>
* { box-sizing: border-box; }
:root { color-scheme: light; font-family: 'Segoe UI', system-ui, sans-serif; color: #164256; }
body { margin:0; min-height:100vh; padding:24px; background:radial-gradient(ellipse at 50% 0%,#4c8292,#163b4a 75%); }
main { max-width:1200px; margin:auto; padding:22px; border:1px solid #f1fdff; border-radius:32px; background:linear-gradient(120deg,#dceef4ee,#a9cad8ed 48%,#dfedf4ee); box-shadow:inset 0 0 0 3px #ffffff65,inset 0 0 0 6px #557b8933,0 22px 65px #041e3266; }
header { display:flex; justify-content:space-between; align-items:center; padding:2px 8px 20px; gap:12px; }
h1 { font-size:17px; font-weight:500; letter-spacing:.34em; margin:0; }
.edition { font-size:10px; letter-spacing:.22em; }
.screen-row,.deck { display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:16px; }
.inset { border:1px solid #e9fbff; border-radius:17px; background:linear-gradient(130deg,#092d3c,#123f50); box-shadow:0 0 0 2px #37637577,inset 0 2px 7px #001823; overflow:hidden; }
.stage { position:relative; aspect-ratio:16/9; isolation:isolate; background:#06222e; }
.stage video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; }
.empty { position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:#b8dce5; gap:12px; background:radial-gradient(ellipse at 50% 20%,#235970,#082733 75%); }
.empty strong { font-weight:300; font-size:clamp(20px,3vw,38px); letter-spacing:.06em; }
.empty span { font-size:12px; letter-spacing:.1em; }
.side { display:grid; grid-template-rows: 2fr 1fr; gap:14px; min-height:0; }
canvas { display:block; width:100%; height:100%; }
.meters,.scope { position:relative; min-height:0; }
.ribbon { height:44px; margin:16px 0; border-radius:14px; }
.clip-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
.row-label { display:none; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.pad { position:relative; text-align:left; min-width:0; aspect-ratio:1.22; padding:14px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid #f1fdff; border-radius:20px; background:radial-gradient(ellipse at 50% 65%,rgba(var(--pad),.64),rgba(var(--pad),.18) 75%),linear-gradient(140deg,#f6fdffbb,#ffffff22 40%,#e2f4ff99); box-shadow:0 0 0 2px #42677888,inset 0 0 0 3px #edfcff99,inset 0 5px 7px #ffffffce,inset 0 -5px 9px #51728b44,0 5px 9px #153d5426; transition:box-shadow .15s,transform .1s,filter .15s; }
.pad:not(:disabled):hover { filter:brightness(1.08); transform:translateY(-1px); }
.pad:not(:disabled):active { transform:translateY(2px); }
.pad[aria-pressed=true] { background:radial-gradient(ellipse at 50% 65%,rgba(var(--pad),.95),rgba(var(--pad),.5) 75%),linear-gradient(140deg,#fff,#ffffff33); box-shadow:0 0 0 2px #1e738888,inset 0 0 0 3px #e6ffff,inset 0 0 20px #ffffffa6,0 0 17px rgba(var(--pad),.6); }
.pad-name { font-size:clamp(12px,1.5vw,17px); font-weight:500; }
.pad-key { position:absolute; top:12px; left:14px; font-size:10px; opacity:.6; }
.pad-mode { font-size:9px; letter-spacing:.09em; opacity:.65; margin-top:3px; text-transform:uppercase; }
.pad::after { content:''; position:absolute; width:6px; height:6px; border-radius:50%; top:14px; right:14px; background:#54717b33; }
.pad[aria-pressed=true]::after { background:#eaffff; box-shadow:0 0 7px #33cfff; }
.pad.pending::after { background:#fff1a7; box-shadow:0 0 6px #eabb57; animation:blink .2s steps(1,end) infinite; }
@keyframes blink { 50% { opacity:.15; } }
.pad::before { content:''; position:absolute; bottom:6px; left:12px; right:12px; height:3px; border-radius:2px; background:#fff2a4; transform:scaleX(var(--progress,0)); transform-origin:left; }
button:disabled { cursor:default; }
button:focus-visible,input:focus-visible { outline:3px solid #075b91; outline-offset:5px; }
.transport { display:flex; flex-direction:column; align-items:center; border-left:1px solid #5a7c8d55; padding-left:16px; }
.volume-label { font-size:11px; letter-spacing:.2em; margin:3px 0 10px; }
.fader { flex:1; min-height:105px; width:110px; position:relative; display:flex; justify-content:center; }
#volume { writing-mode:vertical-lr; direction:rtl; appearance:none; -webkit-appearance:none; width:22px; height:100%; min-height:105px; margin:0; border:1px solid #d8f8ff; border-radius:14px; background:linear-gradient(to top,#49d9ea 0%,#49d9ea var(--volume,80%),#163b4a var(--volume,80%),#163b4a 100%); box-shadow:0 0 0 2px #789eaf,inset 0 0 0 5px #0b3546; cursor:ns-resize; touch-action:none; }
#volume::-webkit-slider-thumb { appearance:none; width:45px; height:26px; border-radius:7px; border:1px solid #faffff; background:linear-gradient(to bottom,#eef7fa,#8da6b1 42%,#e6f3f9 46%,#416575 50%,#e3eff5 54%,#acc3ce 85%,#effaff); box-shadow:0 2px 4px #173e5077,0 0 0 1px #65899a; }
#volume::-moz-range-thumb { width:45px; height:26px; border-radius:7px; border:1px solid white; background:linear-gradient(#effaff,#a3bbc9 44%,#446777 50%,#d7e9f1 57%,#9ab5c2); }
.ticks { position:absolute; left:80px; top:0; bottom:0; width:9px; background:repeating-linear-gradient(to bottom,#557b88 0 1px,transparent 1px 16px); pointer-events:none; }
#volume-value { font-size:10px; font-variant-numeric:tabular-nums; padding:7px; }
.transport-bottom { display:flex; gap:12px; align-items:center; width:100%; justify-content:center; }
#pause { border:1px solid #edffff; border-radius:50%; width:56px; height:56px; flex-shrink:0; font-size:12px; background:linear-gradient(135deg,#e5f8ff,#99becf); box-shadow:0 0 0 2px #60879777,inset 0 2px 5px white,0 3px 5px #34596c44; }
.fade { border:1px solid #f1fcff; border-radius:10px; padding:10px; text-align:center; box-shadow:inset 0 0 10px #ffffff44; }
.fade small { display:block; font-size:9px; letter-spacing:.14em; margin-bottom:4px; }
.fade span { font-size:16px; }
footer { display:flex; justify-content:space-between; gap:16px; align-items:baseline; padding:14px 4px 0; font-size:11px; color:#33566a; }
#status { margin:0; }
.help { font-size:10px; text-align:right; opacity:.85; }
@media(max-width:850px) { body{padding:12px;} main{padding:16px;border-radius:25px;} .screen-row,.deck{grid-template-columns:minmax(0,1fr) 140px;gap:12px;} .clip-grid{gap:9px;} .pad{padding:10px;border-radius:15px;} .pad-key{top:9px;left:10px;} .transport{padding-left:10px;} .transport-bottom{gap:8px;} #pause{width:45px;height:45px;} .fade{padding:8px;} }
@media(max-width:600px) { body{padding:8px;} main{padding:12px;border-radius:20px;} header{padding:5px 2px 14px;} h1{font-size:12px;letter-spacing:.22em;} .edition{font-size:8px;} .screen-row{grid-template-columns:1fr;} .side{display:none;} .deck{grid-template-columns:1fr;} .pad{aspect-ratio:1; padding:8px 5px; border-radius:12px;} .pad-name{font-size:10px;} .pad-key{font-size:8px;top:7px;left:8px;} .pad-mode{font-size:7px;} .pad::after{top:8px;right:8px;width:4px;height:4px;} .clip-grid{gap:8px;} .ribbon{height:30px;margin:12px 0;} .transport{border-left:0;border-top:1px solid #7493a655;padding:12px 0 0;display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:8px;} .volume-label{margin:0;justify-self:end;} .fader{height:112px;min-height:112px;width:80px;} .ticks{left:65px;} #volume-value{grid-column:2;grid-row:2;text-align:center;} .transport-bottom{flex-direction:column;grid-column:3;grid-row:1/3;} footer{display:block;} .help{text-align:left;display:block;margin-top:6px;} }
@media(prefers-reduced-motion:reduce) { .pad{transition:none;} .pad.pending::after{animation:none;} }
</style>
</head>
<body>
  <main>
    <header><h1>PIXEL RHYTHMS</h1><span class="edition">VISUAL MUSIC</span></header>
    <div class="screen-row">
      <div class="stage inset">
        <div class="empty" id="empty"><strong>A world at your fingertips.</strong><span>Tap a pad to play with sound.</span></div>
        <video id="output" loop playsinline preload="auto" aria-label="Audiovisual loop A"></video>
        <video id="incoming" loop playsinline preload="auto" aria-label="Audiovisual loop B"></video>
      </div>
      <aside class="side" aria-label="Live audio feedback">
        <div class="meters inset"><canvas id="meters" aria-label="Left and right audio peak levels"></canvas></div>
        <div class="scope inset"><canvas id="scope" aria-label="Live audio waveform"></canvas></div>
      </aside>
    </div>
    <div class="ribbon inset"><canvas id="ribbon" aria-label="Recent audio amplitude history"></canvas></div>
    <div class="deck">
      <nav aria-label="Choose a scene or party take"><div id="buttons" class="clip-grid"></div></nav>
      <div class="transport">
        <label class="volume-label" for="volume">VOLUME</label>
        <div class="fader"><input id="volume" aria-label="Master volume" type="range" min="0" max="1" step="0.01" value="0.8"><span class="ticks" aria-hidden="true"></span></div>
        <output id="volume-value" for="volume">80%</output>
        <div class="transport-bottom"><button id="pause" disabled aria-label="Pause or resume playback">Pause</button><div class="fade"><small>FADE</small><span>0.5 s</span></div></div>
      </div>
    </div>
    <footer><p id="status" role="status">Choose a loop to begin.</p><span class="help">Scene 1–5 · Party Q–T · Pads unlock after the fade</span></footer>
  </main>

  <script>
    // The only media list. Paths are relative to this index.html file.
    const stems = [
      { key: "1", name: "Mountain", mode: "Scene", label: "Mountain — Scene", file: "Mountain_s.mp4" },
      { key: "2", name: "Car", mode: "Scene", label: "Car — Scene", file: "Car_s.mp4" },
      { key: "3", name: "Glacier", mode: "Scene", label: "Glacier — Scene", file: "Glacier_s.mp4" },
      { key: "4", name: "Tree", mode: "Scene", label: "Tree — Scene", file: "Tree_s.mp4" },
      { key: "5", name: "Ocean", mode: "Scene", label: "Ocean — Scene", file: "Ocean_s.mp4" },
      { key: "q", name: "Mountain", mode: "Party", label: "Mountain — Party", file: "Mountain_p.mp4" },
      { key: "w", name: "Car", mode: "Party", label: "Car — Party", file: "Car_p.mp4" },
      { key: "e", name: "Glacier", mode: "Party", label: "Glacier — Party", file: "Glacier_p.mp4" },
      { key: "r", name: "Tree", mode: "Party", label: "Tree — Party", file: "Tree_p.mp4" },
      { key: "t", name: "Ocean", mode: "Party", label: "Ocean — Party", file: "Ocean_p.mp4" }
    ];

    // References to page elements: similar to cached Unity component references.
    const videos = [document.querySelector("#output"), document.querySelector("#incoming")];
    const buttons = document.querySelector("#buttons");
    const status = document.querySelector("#status");
    const pauseButton = document.querySelector("#pause");
    const volume = document.querySelector("#volume");
    const FADE_SECONDS = 0.5;
    const LOAD_TIMEOUT_MS = 12000;
    let active = -1, busy = false, context, master, gains;
    const padColors = ["54, 204, 234", "166, 146, 228", "72, 161, 213", "88, 195, 191", "211, 182, 111"];

    // Route each video's embedded audio through its own fader.
    function initAudio() {
      if (context) return;
      context = new (window.AudioContext || window.webkitAudioContext)();
      master = context.createGain();
      master.gain.value = Number(volume.value);
      master.connect(context.destination);
      setupMeters();
      gains = videos.map(video => {
        const gain = context.createGain();
        gain.gain.value = 0;
        context.createMediaElementSource(video).connect(gain);
        gain.connect(master);
        return gain;
      });
    }
    function setGain(index, value) {
      gains[index].gain.cancelScheduledValues(context.currentTime);
      gains[index].gain.setValueAtTime(value, context.currentTime);
    }
    function lock(index, value) {
      busy = value;
      buttons.setAttribute("aria-busy", String(value));
      [...buttons.querySelectorAll("button")].forEach((button, i) => {
        button.disabled = value;
        button.classList.toggle("pending", value && i === index);
        button.style.setProperty("--progress", 0);
      });
      pauseButton.disabled = value || active < 0;
    }
    // Keep the outgoing image opaque; dissolve the incoming image over it.
    // Fading both opacities would expose the black background mid-transition.
    function dissolve(next, previous) {
      return new Promise(resolve => {
        const start = context.currentTime;
        setGain(next, previous < 0 ? 1 : 0);
        if (previous >= 0) {
          setGain(previous, 1);
          gains[previous].gain.linearRampToValueAtTime(0, start + FADE_SECONDS);
          gains[next].gain.linearRampToValueAtTime(1, start + FADE_SECONDS);
        }
        function frame() {
          const t = previous < 0 ? 1 : Math.min(1, (context.currentTime - start) / FADE_SECONDS);
          videos[next].style.opacity = t;
          const pending = buttons.querySelector(".pending");
          if (pending) pending.style.setProperty("--progress", t);
          if (t < 1) requestAnimationFrame(frame);
          else resolve();
        }
        frame();
      });
    }
    async function selectStem(index) {
      if (busy || !stems[index]) return;
      const stem = stems[index];
      const previous = active;
      const next = active === 0 ? 1 : 0;
      const video = videos[next];
      lock(index, true);
      status.textContent = `Loading ${stem.label}…`;
      let timer, onError;
      try {
        initAudio();
        setGain(next, 0);
        video.style.opacity = 0;
        video.style.zIndex = 2;
        if (previous >= 0) videos[previous].style.zIndex = 1;
        video.src = encodeURIComponent(stem.file);
        video.load();
        // Start these within the user's gesture, before awaiting either promise.
        const resumed = context.resume();
        const started = video.play();
        const failed = new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("Loading timed out")), LOAD_TIMEOUT_MS);
          onError = () => reject(new Error("Media could not load"));
          video.addEventListener("error", onError, { once: true });
        });
        await Promise.race([Promise.all([resumed, started]), failed]);
        clearTimeout(timer);
        video.removeEventListener("error", onError);
        status.textContent = `Fading to ${stem.label}…`;
        await dissolve(next, previous);
        if (previous >= 0) {
          videos[previous].pause();
          videos[previous].style.opacity = 0;
          setGain(previous, 0);
        }
        active = next;
        document.querySelector("#empty").hidden = true;
        document.querySelector("#empty").style.display = "none";
        [...buttons.querySelectorAll("button")].forEach((button, i) => {
          button.setAttribute("aria-pressed", String(i === index));
        });
        pauseButton.textContent = "Pause";
        status.textContent = `${stem.label} — playing`;
      } catch (error) {
        video.pause();
        video.removeAttribute("src");
        video.load();
        video.style.opacity = 0;
        if (gains) setGain(next, 0);
        status.textContent = `Could not start ${stem.file}. Check the file, then tap again. ${previous >= 0 ? "Your previous clip is retained." : ""}`;
      } finally {
        clearTimeout(timer);
        if (onError) video.removeEventListener("error", onError);
        lock(index, false);
      }
    }
    volume.addEventListener("input", () => {
      volume.style.setProperty("--volume", `${Number(volume.value)*100}%`);
      document.querySelector("#volume-value").textContent = `${Math.round(Number(volume.value)*100)}%`;
      if (master) master.gain.setTargetAtTime(Number(volume.value), context.currentTime, 0.02);
    });
    pauseButton.addEventListener("click", async () => {
      if (busy || active < 0) return;
      const video = videos[active];
      if (video.paused) {
        try {
          await Promise.all([context.resume(), video.play()]);
          pauseButton.textContent = "Pause";
        } catch { status.textContent = "Could not resume. Tap a pad to try again."; }
      } else {
        video.pause();
        pauseButton.textContent = "Play";
      }
    });

    let analyser, channels, waveData, channelData;
    const history = new Float32Array(180);
    const meterLevels = [0, 0];
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    function setupMeters() {
      analyser = context.createAnalyser();
      analyser.fftSize = 1024;
      master.connect(analyser);
      waveData = new Float32Array(analyser.fftSize);
      const splitter = context.createChannelSplitter(2);
      master.connect(splitter);
      channels = [0,1].map(i => {
        const a = context.createAnalyser(); a.fftSize = 1024;
        splitter.connect(a, i); return a;
      });
      channelData = channels.map(a => new Float32Array(a.fftSize));
    }
    const surfaces = ['meters','scope','ribbon'].map(id => {
      const canvas = document.getElementById(id);
      return {canvas, ctx:canvas.getContext('2d'), width:0, height:0};
    });
    const observer = new ResizeObserver(() => surfaces.forEach(s => {
      const rect = s.canvas.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio || 1, 2);
      s.width = rect.width; s.height = rect.height;
      s.canvas.width = Math.round(rect.width*dpr); s.canvas.height = Math.round(rect.height*dpr);
      s.ctx.setTransform(dpr,0,0,dpr,0,0);
    }));
    surfaces.forEach(s => observer.observe(s.canvas));
    let lastDraw = 0;
    function drawFeedback(now) {
      requestAnimationFrame(drawFeedback);
      if (document.hidden || now-lastDraw < (reducedMotion.matches ? 150 : 33)) return;
      lastDraw = now;
      const playing = context?.state === 'running' && videos.some(v => !v.paused && v.readyState >= 2);
      let rms = 0;
      if (analyser && playing) {
        analyser.getFloatTimeDomainData(waveData);
        for (const sample of waveData) rms += sample*sample;
        rms = Math.sqrt(rms/waveData.length);
      } else if (waveData) waveData.fill(0);
      history.copyWithin(0,1); history[history.length-1] = Math.min(1,rms*3);
      surfaces.forEach(s => s.ctx.clearRect(0,0,s.width,s.height));
      const m = surfaces[0], c = m.ctx, w = m.width, h = m.height;
      if (w && h) {
        const top = 20, height = Math.max(20,h-48), count = 26;
        for (let ch=0;ch<2;ch++) {
          let peak=0;
          if (channels && playing) { channels[ch].getFloatTimeDomainData(channelData[ch]); for (const v of channelData[ch]) peak=Math.max(peak,Math.abs(v)); }
          const level = Math.max(0,Math.min(1,(20*Math.log10(Math.max(peak,0.001))+48)/48));
          meterLevels[ch]=Math.max(level,meterLevels[ch]*0.88);
          const x=w*(ch ? .52 : .22), bar=Math.max(9,w*.12);
          for(let i=0;i<count;i++) {
            c.fillStyle=i/count<meterLevels[ch] ? (ch ? '#f1d785' : '#52dfef') : '#244955';
            c.fillRect(x,top+height-(i+1)*height/count,bar,Math.max(2,height/count-3));
          }
          c.fillStyle='#c4dfe5'; c.font='10px system-ui'; c.textAlign='center'; c.fillText(ch?'R':'L',x+bar/2,h-12);
        }
        c.fillStyle='#a7c7d1';c.font='9px system-ui';c.textAlign='left';
        [0,-12,-24,-36,-48].forEach((v,i)=>c.fillText(String(v),w*.77,top+5+i*(height-5)/4));
      }
      const scope=surfaces[1];
      if(scope.width && scope.height) {
        const c=scope.ctx,w=scope.width,h=scope.height;
        c.strokeStyle='#3e6978';c.lineWidth=.5;c.beginPath();c.moveTo(12,h/2);c.lineTo(w-12,h/2);c.stroke();
        if(waveData && playing) {
          c.strokeStyle='#78e7ed';c.lineWidth=1.4;c.beginPath();
          for(let i=0;i<256;i++) { const x=12+i/255*(w-24), y=h/2+waveData[i*4]*(h*.4); if(i)c.lineTo(x,y);else c.moveTo(x,y); } c.stroke();
        }
      }
      const r=surfaces[2];
      for(let i=0;i<history.length;i++) {
        const x=10+i/history.length*(r.width-20), amplitude=Math.max(1,history[i]*(r.height-10));
        r.ctx.fillStyle=i/history.length>.7?'#efdc9d':'#62dce9';
        r.ctx.globalAlpha=history[i]>.005 ? .9 : .2;
        r.ctx.fillRect(x,(r.height-amplitude)/2,Math.max(1,(r.width-20)/history.length-2),amplitude);
      }
      r.ctx.globalAlpha=1;
    }
    requestAnimationFrame(drawFeedback);

    // Build two aligned rows from the same media list.
    stems.forEach((stem, index) => {
      if (index === 0 || stem.mode !== stems[index - 1].mode) {
        const rowLabel = document.createElement("span");
        rowLabel.className = "row-label";
        rowLabel.textContent = stem.mode;
        buttons.append(rowLabel);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pad";
      button.style.setProperty("--pad", padColors[index % 5]);
      const name = document.createElement("span");
      name.className = "pad-name";
      name.textContent = stem.name;
      const key = document.createElement("span");
      key.className = "pad-key";
      key.textContent = stem.key.toUpperCase();
      const mode = document.createElement("span");
      mode.className = "pad-mode";
      mode.textContent = stem.mode;
      button.append(name, key, mode);
      button.setAttribute("aria-label", `${stem.label}, key ${stem.key.toUpperCase()}`);
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => selectStem(index));
      buttons.append(button);
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.closest("input, textarea, select, [contenteditable=true]")) return;
      if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
      const index = stems.findIndex(stem => stem.key === event.key.toLowerCase());
      if (index === -1) return;
      event.preventDefault();
      selectStem(index);
    });
  </script>
</body>
</html>
